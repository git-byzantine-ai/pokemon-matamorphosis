<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FireRed · Metamorphosis</title>
<style>
:root{color-scheme:dark;font:16px system-ui;background:#101613;color:#ecf4ee}body{max-width:1050px;margin:40px auto;padding:0 24px}h1{font-size:30px;font-weight:600;margin-bottom:8px}header{border-bottom:1px solid #33443b;padding-bottom:24px}p{color:#b0c6b7}#status{display:flex;flex-wrap:wrap;gap:12px;margin:24px 0}.tag{padding:7px 12px;background:#203329;border-radius:6px}.jobs{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:18px}.job{background:#19251e;border:1px solid #30463a;border-radius:10px;padding:18px}.pair{display:flex;justify-content:center;gap:12px;background:#d7e4db;border-radius:6px;margin:14px 0}.pair img{width:128px;height:128px;image-rendering:pixelated}h2{font-size:18px;margin:0}.details{font-size:13px;color:#aac4b3;overflow-wrap:anywhere}.error{color:#ffb5ac;white-space:pre-wrap}.shares{font-size:14px;line-height:1.7}button{font:inherit;padding:8px 12px;cursor:pointer}#empty{padding:32px 0}@media(max-width:400px){body{padding:0 12px}.pair img{width:64px;height:64px}}
</style>
<header><h1>Gradual metamorphosis</h1><p>Bank essence in battle. Choose when to metamorphosize.</p></header>
<div id="status" aria-live="polite"></div><p id="error" class="error"></p><div id="jobs" class="jobs"></div><p id="empty">Connect mGBA, then choose Pokémon → Metamorphosis in the game.</p>
<script>
const status=document.getElementById('status'),jobs=document.getElementById('jobs');
function text(tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;return e;}
async function refresh(){try{const s=await(await fetch('/api/status')).json();status.replaceChildren(...[s.connected?'Emulator connected':'Waiting for emulator',s.provider==='local-sd'?'Local AI · no API fees':'Preview mode · not AI',...Object.entries(s.counts).map(([k,v])=>`${v} ${k}`)].map(v=>text('span',v,'tag')));document.getElementById('error').textContent=s.error||'';document.getElementById('empty').hidden=s.jobs.length>0;jobs.replaceChildren(...s.jobs.map(j=>{const card=text('article','','job');card.append(text('h2',`Metamorphosis at Lv. ${j.level} · ${j.status}`),text('p',j.identity,'details'));if(j.status==='ready'){const pair=text('div','','pair');for(const view of ['front','back']){const img=document.createElement('img');img.src=`/sprites/${j.key}/${view}.png`;img.alt=view+' sprite';pair.append(img);}card.append(pair);if(s.connected&&(s.cached_assets||[]).includes(j.key.slice(0,8)))card.append(text('p','Loaded into emulator cache','details'));}card.append(text('div',`Base ${(j.recipe.lineage_mass*100).toFixed(1)}% · ${(j.recipe.ev_totals||[]).reduce((a,b)=>a+b,0)}/510 EVs`,'shares'));if(j.design){const details=document.createElement('details');details.append(text('summary','Creature design'),text('p',j.design,'details'));card.append(details);}if(j.error)card.append(text('p',j.error,'error'));return card;}));}catch(e){document.getElementById('error').textContent='Companion connection lost.';}}
refresh();setInterval(refresh,2000);
</script></html>
